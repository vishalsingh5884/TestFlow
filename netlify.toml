[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

[functions."api"]
  format = "esm"
  external_node_modules = ["express", "cors", "dotenv", "bcryptjs", "serverless-http", "@netlify/blobs", "nodemailer", "@google/genai"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
